# FluxGG Reborn — przykładowa konfiguracja nginx dla VPS
# Frontend: statyczny build z frontend/build
# Backend: uvicorn na 127.0.0.1:8001 (pm2)

server {
    listen 80;
    server_name fluxgg.eu www.fluxgg.eu;

    root /var/www/fluxgg-reborn/frontend/build;
    index index.html;

    # Backend API — BEZ TEGO logowanie nie zadziała
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — wszystkie inne ścieżki na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
